<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QQQ • Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #c9d1d9;
      --green: #3fb950;
      --red: #f85149;
    }
    
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }
    
    .container { max-width: 680px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    
    .symbol {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -2px;
    }
    
    .price-card {
      background: var(--card);
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      margin-bottom: 24px;
    }
    
    #current-price {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 1;
    }
    
    .change {
      font-size: 24px;
      margin-top: 8px;
      font-weight: 600;
    }
    .change.positive { color: var(--green); }
    .change.negative { color: var(--red); }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 30px;
    }
    
    .card {
      background: var(--card);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    
    .card-label {
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 6px;
    }
    
    .card-value {
      font-size: 28px;
      font-weight: 600;
    }
    
    /* Day's Range Bar */
    .range-bar-wrap {
      background: var(--card);
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 24px 20px 20px;
      position: relative;
    }
    
    .range-header {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      color: #8b949e;
      margin-bottom: 12px;
    }
