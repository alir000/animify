<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QQQ • Live</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --text: #c9d1d9;
      --green: #3fb950;
      --red: #f85149;
    }
    
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 20px;
      min-height: 100vh;
    }
    
    .container { max-width: 680px; margin: 0 auto; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    
    .symbol {
      font-size: 42px;
      font-weight: 700;
      letter-spacing: -2px;
    }
    
    .price-card {
      background: var(--card);
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      margin-bottom: 24px;
    }
    
    #current-price {
      font-size: 64px;
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 1;
    }
    
    .change {
      font-size: 24px;
      margin-top: 8px;
      font-weight: 600;
    }
    .change.positive { color: var(--green); }
    .change.negative { color: var(--red); }
    
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 30px;
    }
    
    .card {
      background: var(--card);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    
    .card-label {
      font-size: 14px;
      color: #8b949e;
      margin-bottom: 6px;
    }
    
    .card-value {
      font-size: 28px;
      font-weight: 600;
    }
    
    /* Day's Range Bar */
    .range-bar-wrap {
      background: var(--card);
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 24px 20px 20px;
      position: relative;
    }
    
    .range-header {
      display: flex;
      justify-content: space-between;
      font-size: 22px;
      color: #8b949e;
      margin-bottom: 12px;
    }
    
    .range-bar-track {
      height: 8px;
      background: #30363d;
      border-radius: 9999px;
      position: relative;
    }
    
    .range-bar-fill {
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      background: linear-gradient(90deg, #f85149, #3fb950);
      border-radius: 9999px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }
    
    .range-bar-marker {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 18px;
      height: 18px;
      background: #ffffff;
      border: 3px solid #0d1117;
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(255,255,255,0.5);
      transition: left 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 10;
    }
    
    /* Floating label ABOVE the white dot - CURRENT PRICE + % FROM OPEN */
    .range-current-label-wrap {
      position: absolute;
      top: -68px;
      left: 0;
      width: 100%;
      pointer-events: none;
    }
    
    .range-current-label {
      position: absolute;
      transform: translateX(-50%);
      text-align: center;
      background: rgba(13, 17, 23, 0.98);
      border: 1px solid #30363d;
      border-radius: 12px;
      padding: 10px 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
      white-space: nowrap;
      min-width: 130px;
      line-height: 1.05;
    }
    
    .range-current-label .price {
      display: block;
      font-size: 29px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
    }
    
    .range-current-label .pct {
      display: block;
      font-size: 17px;
      font-weight: 600;
    }
    
    .range-current-label.positive .pct { color: var(--green); }
    .range-current-label.negative .pct { color: var(--red); }
    
    .range-labels {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      font-size: 15px;
    }
    
    .range-pct { font-size: 14px; font-weight: 600; }
    .range-pct.positive { color: var(--green); }
    .range-pct.negative { color: var(--red); }
    
    .footer {
      text-align: center;
      margin-top: 40px;
      color: #8b949e;
      font-size: 14px;
    }
    
    #refresh-btn {
      background: #21262d;
      color: #fff;
      border: 1px solid #30363d;
      padding: 10px 20px;
      border-radius: 9999px;
      cursor: pointer;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="symbol">QQQ</div>
      <button id="refresh-btn" onclick="loadData()">Refresh</button>
    </header>

    <div class="price-card">
      <div id="current-price">$—</div>
      <div id="change" class="change">
        <span id="change-amount">—</span>
        <span id="change-pct"> (—%)</span>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="card-label">OPEN</div>
        <div id="open" class="card-value">$—</div>
      </div>
      <div class="card">
        <div class="card-label">DAY LOW</div>
        <div id="day-low" class="card-value">$—</div>
      </div>
      <div class="card">
        <div class="card-label">DAY HIGH</div>
        <div id="day-high" class="card-value">$—</div>
      </div>
    </div>

    <!-- Day's Range Bar -->
    <div class="range-bar-wrap">
      <div class="range-header">
        <span>DAY'S RANGE</span>
        <span id="last-updated">Updated just now</span>
      </div>
      
      <div class="range-bar-track">
        <div class="range-bar-fill" id="bar-fill" style="width:0%"></div>
        <div class="range-bar-marker" id="bar-marker" style="left:0%"></div>
      </div>

      <!-- Floating label ABOVE the white dot -->
      <div class="range-current-label-wrap">
        <div class="range-current-label" id="current-pct-label" style="left:50%">
          <span class="price">$—</span>
          <span class="pct">—</span>
        </div>
      </div>

      <div class="range-labels">
        <div>
          <div id="range-low" style="font-weight:600">$—</div>
          <span id="low-pct" class="range-pct">—</span>
        </div>
        <div style="text-align:right">
          <div id="range-high" style="font-weight:600">$—</div>
          <span id="high-pct" class="range-pct">—</span>
        </div>
      </div>
    </div>

    <div class="footer">
      Data from Yahoo Finance • Updates every 30 seconds
    </div>
  </div>

  <script>
    const SYMBOL = 'QQQ';
    const PROXY = 'https://corsproxy.io/?url=';

    const fmt = (n, dec = 2) => n != null ? Number(n).toLocaleString('en-US', {minimumFractionDigits: dec, maximumFractionDigits: dec}) : '—';
    const fmtPct = (n) => {
      if (n == null) return '—';
      const sign = n >= 0 ? '+' : '';
      return sign + fmt(n) + '%';
    };

    async function loadData() {
      const btn = document.getElementById('refresh-btn');
      btn.disabled = true;
      btn.textContent = 'Loading...';

      try {
        const res = await fetch(PROXY + encodeURIComponent(`https://query1.finance.yahoo.com/v8/finance/chart/${SYMBOL}?interval=1d&range=1d&includePrePost=true`));
        const data = await res.json();
        const result = data.chart.result[0];
        const meta = result.meta;
        const quote = result.indicators.quote[0];

        const state = meta.marketState || 'CLOSED';
        const regularPrice = meta.regularMarketPrice;
        const prevClose = meta.chartPreviousClose;
        const openPrice = meta.regularMarketOpen ?? quote.open[0];

        let displayPrice = regularPrice;
        if (state === 'PRE' && meta.preMarketPrice) displayPrice = meta.preMarketPrice;
        if ((state === 'POST' || state === 'POSTPOST') && meta.postMarketPrice) displayPrice = meta.postMarketPrice;

        const changeAmt = displayPrice - prevClose;
        const changePct = (changeAmt / prevClose) * 100;

        // Top price
        document.getElementById('current-price').textContent = '$' + fmt(displayPrice, 2);
        const changeEl = document.getElementById('change');
        document.getElementById('change-amount').textContent = (changeAmt >= 0 ? '+' : '') + fmt(changeAmt, 2);
        document.getElementById('change-pct').textContent = ` (${(changeAmt >= 0 ? '+' : '') + fmt(changePct)}%)`;
        changeEl.className = `change ${changeAmt >= 0 ? 'positive' : 'negative'}`;

        // Cards
        document.getElementById('open').textContent = '$' + fmt(openPrice, 2);
        document.getElementById('day-low').textContent = '$' + fmt(meta.regularMarketDayLow, 2);
        document.getElementById('day-high').textContent = '$' + fmt(meta.regularMarketDayHigh, 2);

        // Range bar
        const low = meta.regularMarketDayLow;
        const high = meta.regularMarketDayHigh;
        const pct = (high !== low) ? ((regularPrice - low) / (high - low)) * 100 : 50;
        const clamped = Math.max(0, Math.min(100, pct));

        document.getElementById('bar-fill').style.width = clamped + '%';
        document.getElementById('bar-marker').style.left = clamped + '%';

        // % from open
        const curPctFromOpen = openPrice ? ((regularPrice - openPrice) / openPrice) * 100 : null;

        // Floating label ABOVE the white dot (current price + % from open)
        const label = document.getElementById('current-pct-label');
        label.querySelector('.price').textContent = '$' + fmt(displayPrice, 2);
        const pctSpan = label.querySelector('.pct');
        pctSpan.textContent = fmtPct(curPctFromOpen);
        label.className = `range-current-label ${curPctFromOpen >= 0 ? 'positive' : 'negative'}`;
        label.style.left = clamped + '%';

        // Low / High labels
        const lowPct = openPrice ? ((low - openPrice) / openPrice) * 100 : null;
        const highPct = openPrice ? ((high - openPrice) / openPrice) * 100 : null;
        document.getElementById('range-low').textContent = '$' + fmt(low, 2);
        document.getElementById('low-pct').textContent = fmtPct(lowPct);
        document.getElementById('low-pct').className = `range-pct ${lowPct >= 0 ? 'positive' : 'negative'}`;
        document.getElementById('range-high').textContent = '$' + fmt(high, 2);
        document.getElementById('high-pct').textContent = fmtPct(highPct);
        document.getElementById('high-pct').className = `range-pct ${highPct >= 0 ? 'positive' : 'negative'}`;

        // Timestamp
        const now = new Date();
        document.getElementById('last-updated').textContent = `Updated ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;

      } catch (e) {
        console.error(e);
      }

      btn.disabled = false;
      btn.textContent = 'Refresh';
    }

    loadData();
    setInterval(loadData, 30000);
  </script>
</body>
</html>
