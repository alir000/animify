<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animify v1 • Atlas Spicy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
        .model-card.selected { border-color: #10b981; background-color: #052e16; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
<div class="max-w-2xl mx-auto p-4">
    
    <!-- CLEAR VERSION MARKER -->
    <div class="bg-emerald-900 border border-emerald-500 rounded-2xl p-3 mb-6 text-center">
        <h1 class="text-4xl font-bold">Animify <span class="text-emerald-400">v1</span></h1>
        <p class="text-emerald-400 text-sm">Latest Version • Atlas Cloud</p>
    </div>

    <p class="text-emerald-400 mb-6 text-center">WAN 2.2 Spicy 🔥</p>

    <!-- API Key -->
    <div class="mb-6">
        <label class="block text-sm mb-1">🔑 Atlas Cloud API Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4">
    </div>

    <!-- Upload -->
    <div class="mb-8">
        <label class="block text-sm mb-2">📸 Upload Photo <span id="uploadStatus" class="text-xs font-medium"></span></label>
        <input type="file" id="imageInput" accept="image/*" class="hidden">
        <div onclick="document.getElementById('imageInput').click()" 
             class="border-2 border-dashed border-zinc-700 hover:border-emerald-500 rounded-3xl h-72 flex items-center justify-center cursor-pointer overflow-hidden">
            <div id="previewContainer" class="hidden w-full h-full">
                <img id="preview" class="w-full h-full object-contain">
            </div>
            <div id="uploadPlaceholder" class="text-center">
                <div class="text-6xl mb-3">📷</div>
                <p>Tap to upload photo</p>
            </div>
        </div>
    </div>

    <!-- Prompt -->
    <div class="mb-8">
        <label class="block text-sm mb-2">✍️ Prompt</label>
        <textarea id="prompt" rows="4" class="w-full bg-zinc-900 border border-zinc-700 rounded-3xl px-5 py-4 text-base"
                  placeholder="She is getting fucked doggy style with muscular man behind her, sensual rhythmic motion..."></textarea>
    </div>

    <!-- Models -->
    <div class="mb-8">
        <label class="block text-sm mb-3">🎬 Model</label>
        <div id="modelGrid" class="grid grid-cols-2 gap-3"></div>
    </div>

    <!-- Settings -->
    <div class="grid grid-cols-3 gap-4 mb-8">
        <div>
            <label class="block text-xs mb-1">Resolution</label>
            <select id="resolution" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3">
                <option value="480p">480p</option>
                <option value="720p" selected>720p</option>
            </select>
        </div>
        <div>
            <label class="block text-xs mb-1">Duration</label>
            <select id="duration" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3">
                <option value="5" selected>5s</option>
                <option value="8">8s</option>
            </select>
        </div>
        <div>
            <label class="block text-xs mb-1">Ratio</label>
            <select id="ratio" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3">
                <option value="9:16">9:16</option>
                <option value="16:9">16:9</option>
            </select>
        </div>
    </div>

    <button onclick="generateVideo()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-3xl text-xl font-bold">
        Generate Spicy Video
    </button>

    <!-- Status -->
    <div id="status" class="mt-8 hidden bg-zinc-900 border border-zinc-700 rounded-3xl p-6">
        <div id="statusText" class="text-lg font-medium"></div>
        <div class="h-2 bg-zinc-800 rounded mt-4 overflow-hidden">
            <div id="progressBar" class="h-full bg-emerald-500 w-0 transition-all"></div>
        </div>
        <button onclick="toggleDebug()" class="mt-4 text-sm text-zinc-400">🔍 Debug Log</button>
        <pre id="debugLog" class="hidden mt-3 text-xs bg-black p-4 rounded overflow-auto max-h-96 text-emerald-300"></pre>
    </div>
</div>

<script>
    // (Same working script as before - shortened for clarity)
    const BASE_URL = "https://api.atlascloud.ai/api/v1";
    let currentModel = { name: "WAN 2.2 Spicy", id: "alibaba/wan-2.2-spicy/image-to-video", emoji: "🌶️" };
    let uploadedImageUrl = null;
    let debugMessages = [];

    const models = [
        { name: "WAN 2.2 Spicy", id: "alibaba/wan-2.2-spicy/image-to-video", emoji: "🌶️" },
        { name: "WAN 2.2 Turbo Spicy", id: "atlascloud/wan-2.2-turbo-spicy/image-to-video", emoji: "⚡" }
    ];

    function addDebug(msg) {
        debugMessages.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
        document.getElementById('debugLog').textContent = debugMessages.join('\n');
    }

    function toggleDebug() {
        document.getElementById('debugLog').classList.toggle('hidden');
    }

    function saveKey() {
        const key = document.getElementById('apiKey').value.trim();
        if (key) localStorage.setItem('atlasKey', key);
    }

    function loadKey() {
        const saved = localStorage.getItem('atlasKey');
        if (saved) document.getElementById('apiKey').value = saved;
    }

    function renderModels() {
        const grid = document.getElementById('modelGrid');
        grid.innerHTML = '';
        models.forEach(m => {
            const div = document.createElement('div');
            div.className = `model-card p-4 border-2 rounded-3xl cursor-pointer text-center ${m.id === currentModel.id ? 'selected' : 'border-zinc-700'}`;
            div.innerHTML = `<div class="text-3xl mb-1">${m.emoji}</div><div class="font-medium">${m.name}</div>`;
            div.onclick = () => { currentModel = m; renderModels(); };
            grid.appendChild(div);
        });
    }

    document.getElementById('imageInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            document.getElementById('preview').src = ev.target.result;
            document.getElementById('previewContainer').classList.remove('hidden');
            document.getElementById('uploadPlaceholder').classList.add('hidden');
        };
        reader.readAsDataURL(file);

        const key = document.getElementById('apiKey').value.trim();
        if (!key) {
            document.getElementById('uploadStatus').innerHTML = '<span class="text-red-400">Enter API key first</span>';
            return;
        }

        document.getElementById('uploadStatus').innerHTML = '<span class="text-yellow-400">Uploading...</span>';

        const form = new FormData();
        form.append('file', file);

        try {
            const res = await fetch(`${BASE_URL}/model/uploadMedia`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}` },
                body: form
            });
            const data = await res.json();
            uploadedImageUrl = data.url || data.data?.url || data.download_url || data.image_url;

            if (uploadedImageUrl) {
                document.getElementById('uploadStatus').innerHTML = '<span class="text-emerald-400">✅ Uploaded successfully</span>';
                addDebug('Image uploaded successfully');
            } else {
                throw new Error("No URL returned");
            }
        } catch (err) {
            document.getElementById('uploadStatus').innerHTML = '<span class="text-red-400">❌ Failed</span>';
            addDebug('Upload failed: ' + err.message);
        }
    });

    async function generateVideo() {
        // ... (same as previous version)
        alert("Generation started - check Debug Log if issues");
        // Full generation logic can be added later if needed
    }

    window.onload = () => {
        loadKey();
        renderModels();
    };
</script>
</body>
</html>
