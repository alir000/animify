<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animify v2 • Atlas Spicy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, sans-serif; }
        .model-card.selected { border-color: #10b981; background-color: #052e16; }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">
<div class="max-w-2xl mx-auto p-4">
    <div class="bg-emerald-900 border border-emerald-500 rounded-2xl p-3 mb-6 text-center">
        <h1 class="text-4xl font-bold">Animify <span class="text-emerald-400">v1</span></h1>
        <p class="text-emerald-400 text-sm">Latest Version</p>
    </div>

    <!-- API Key -->
    <div class="mb-6">
        <label class="block text-sm mb-1">🔑 Atlas Cloud API Key</label>
        <input id="apiKey" type="password" placeholder="sk-..." 
               class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-5 py-4">
    </div>

    <!-- Upload -->
    <div class="mb-8">
        <label class="block text-sm mb-2">📸 Upload Photo <span id="uploadStatus" class="text-xs font-medium"></span></label>
        <input type="file" id="imageInput" accept="image/*" class="hidden">
        <div onclick="document.getElementById('imageInput').click()" 
             class="border-2 border-dashed border-zinc-700 hover:border-emerald-500 rounded-3xl h-72 flex items-center justify-center cursor-pointer overflow-hidden">
            <div id="previewContainer" class="hidden w-full h-full">
                <img id="preview" class="w-full h-full object-contain">
            </div>
            <div id="uploadPlaceholder" class="text-center">
                <div class="text-6xl mb-3">📷</div>
                <p>Tap to upload photo</p>
            </div>
        </div>
    </div>

    <!-- Prompt -->
    <div class="mb-8">
        <label class="block text-sm mb-2">✍️ Prompt</label>
        <textarea id="prompt" rows="4" class="w-full bg-zinc-900 border border-zinc-700 rounded-3xl px-5 py-4 text-base"
                  placeholder="She is getting fucked doggy style..."></textarea>
    </div>

    <button onclick="generateVideo()" class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-3xl text-xl font-bold">
        Generate Spicy Video
    </button>

    <!-- Status -->
    <div id="status" class="mt-8 hidden bg-zinc-900 border border-zinc-700 rounded-3xl p-6">
        <div id="statusText" class="text-lg font-medium"></div>
        <button onclick="toggleDebug()" class="mt-4 text-sm text-zinc-400">🔍 Debug Log</button>
        <pre id="debugLog" class="hidden mt-3 text-xs bg-black p-4 rounded overflow-auto max-h-96 text-red-400"></pre>
    </div>
</div>

<script>
    const BASE_URL = "https://api.atlascloud.ai/api/v1";
    let uploadedImageUrl = null;

    function addDebug(msg) {
        const log = document.getElementById('debugLog');
        const time = new Date().toLocaleTimeString();
        log.textContent += `[${time}] ${msg}\n`;
        log.classList.remove('hidden');
    }

    function toggleDebug() {
        document.getElementById('debugLog').classList.toggle('hidden');
    }

    // Image Upload - Improved with full error details
    document.getElementById('imageInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Preview
        const reader = new FileReader();
        reader.onload = ev => {
            document.getElementById('preview').src = ev.target.result;
            document.getElementById('previewContainer').classList.remove('hidden');
            document.getElementById('uploadPlaceholder').classList.add('hidden');
        };
        reader.readAsDataURL(file);

        const key = document.getElementById('apiKey').value.trim();
        if (!key) {
            document.getElementById('uploadStatus').innerHTML = '❌ Enter API key first';
            return;
        }

        document.getElementById('uploadStatus').innerHTML = '⏳ Uploading...';

        const form = new FormData();
        form.append('file', file);

        try {
            const res = await fetch(`${BASE_URL}/model/uploadMedia`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${key}` },
                body: form
            });

            const text = await res.text();
            let data;
            try { data = JSON.parse(text); } catch { data = text; }

            addDebug(`Upload Status: ${res.status} ${res.statusText}`);
            addDebug(`Response: ${text.substring(0, 500)}...`);

            if (!res.ok) throw new Error(`HTTP ${res.status}: ${text}`);

            uploadedImageUrl = data.url || data.data?.url || data.data?.download_url || data.download_url;

            if (uploadedImageUrl) {
                document.getElementById('uploadStatus').innerHTML = '✅ Uploaded successfully';
                addDebug('SUCCESS - Image URL ready');
            } else {
                throw new Error("No URL in response");
            }
        } catch (err) {
            document.getElementById('uploadStatus').innerHTML = '❌ Failed';
            addDebug(`ERROR: ${err.message}`);
        }
    });

    window.onload = () => {
        console.log("%cAnimify v1 loaded", "color:#10b981;font-size:16px");
    };
</script>
</body>
</html>
