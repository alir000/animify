<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animify • Atlas Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
        .model-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .model-card.selected { border-color: #22c55e; background-color: #052e16; transform: scale(1.05); }
    </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen pb-12">
    <div class="max-w-2xl mx-auto p-4">
        <h1 class="text-4xl font-bold mb-1">Animify</h1>
        <p class="text-emerald-400 mb-6">Atlas Cloud • WAN 2.2 Spicy Powered 🔥</p>

        <!-- API Key -->
        <div class="mb-6">
            <label class="block text-sm font-medium mb-1">🔑 Atlas Cloud API Key <span class="text-emerald-400 text-xs">(saved automatically)</span></label>
            <input id="apiKey" type="password" 
                   class="w-full bg-zinc-900 border border-zinc-700 focus:border-emerald-500 rounded-2xl px-5 py-4 text-sm">
        </div>

        <!-- Photo Upload -->
        <div class="mb-8">
            <label class="block text-sm font-medium mb-2">📸 Upload Starting Photo</label>
            <input type="file" id="imageInput" accept="image/*" class="hidden">
            <div onclick="document.getElementById('imageInput').click()" 
                 class="border-2 border-dashed border-zinc-700 hover:border-emerald-500 rounded-3xl h-72 flex flex-col items-center justify-center cursor-pointer overflow-hidden">
                <div id="previewContainer" class="hidden w-full h-full">
                    <img id="preview" class="w-full h-full object-contain">
                </div>
                <div id="uploadPlaceholder" class="text-center">
                    <div class="text-6xl mb-3">📷</div>
                    <p class="text-lg">Tap to upload photo</p>
                    <p class="text-xs text-zinc-500 mt-1">Best results with full-body or clear pose</p>
                </div>
            </div>
        </div>

        <!-- Prompt -->
        <div class="mb-8">
            <label class="block text-sm font-medium mb-2">✍️ What should happen in the video?</label>
            <textarea id="prompt" rows="4" 
                      class="w-full bg-zinc-900 border border-zinc-700 focus:border-emerald-500 rounded-3xl px-5 py-4 text-base"
                      placeholder="She is sitting in doggy pose with lingerie and a muscular man sitting hips attached behind her, sensual slow rhythmic motion..."></textarea>
            <p class="text-xs text-zinc-500 mt-2">Tip: WAN 2.2 Spicy handles direct/spicy descriptions very well.</p>
        </div>

        <!-- Model Selector -->
        <div class="mb-8">
            <label class="block text-sm font-medium mb-3">🎬 Choose Model (WAN 2.2 Spicy = Default)</label>
            <div id="modelGrid" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>
        </div>

        <!-- Settings -->
        <div class="grid grid-cols-3 gap-4 mb-8">
            <div>
                <label class="block text-xs uppercase tracking-widest mb-1">Resolution</label>
                <select id="resolution" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3">
                    <option value="480p">480p (Fast)</option>
                    <option value="720p" selected>720p (Best)</option>
                </select>
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest mb-1">Duration</label>
                <select id="duration" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3">
                    <option value="5" selected>5 seconds</option>
                    <option value="8">8 seconds</option>
                </select>
            </div>
            <div>
                <label class="block text-xs uppercase tracking-widest mb-1">Ratio</label>
                <select id="ratio" class="w-full bg-zinc-900 border border-zinc-700 rounded-2xl px-4 py-3">
                    <option value="9:16">9:16 (Phone)</option>
                    <option value="16:9">16:9 (Wide)</option>
                    <option value="1:1">1:1 Square</option>
                </select>
            </div>
        </div>

        <button onclick="generateVideo()" 
                id="generateBtn"
                class="w-full bg-emerald-600 hover:bg-emerald-500 py-5 rounded-3xl text-xl font-semibold flex items-center justify-center gap-2">
            <span>Generate Spicy Video</span>
        </button>

        <!-- Status -->
        <div id="status" class="mt-8 hidden bg-zinc-900 border border-zinc-700 rounded-3xl p-6">
            <div id="statusText" class="text-lg font-medium"></div>
            <div class="h-2 bg-zinc-800 rounded-2xl mt-4 overflow-hidden">
                <div id="progressBar" class="h-full bg-emerald-500 w-0 transition-all duration-300"></div>
            </div>
            <button onclick="toggleDebug()" class="mt-5 text-xs flex items-center gap-1 text-zinc-400 hover:text-white">
                🔍 Show Debug Log
            </button>
            <pre id="debugLog" class="hidden mt-4 text-xs bg-black p-4 rounded-2xl overflow-auto max-h-80 text-emerald-300 font-mono"></pre>
        </div>
    </div>

    <script>
        // ==================== CONFIG ====================
        const BASE_URL = "https://api.atlascloud.ai/api/v1";

        let currentModel = {
            name: "WAN 2.2 Spicy",
            id: "alibaba/wan-2.2-spicy/image-to-video",
            emoji: "🌶️"
        };

        const models = [
            { name: "WAN 2.2 Spicy", id: "alibaba/wan-2.2-spicy/image-to-video", emoji: "🌶️" },
            { name: "WAN 2.2 Turbo Spicy", id: "atlascloud/wan-2.2-turbo-spicy/image-to-video", emoji: "⚡" },
            { name: "WAN 2.2 Standard", id: "alibaba/wan-2.2/image-to-video", emoji: "🌊" },
            { name: "Kling 3.0 Pro", id: "kwaivgi/kling-v3.0-pro/image-to-video", emoji: "👑" },
            { name: "Seedance 2.0", id: "bytedance/seedance-2.0/image-to-video", emoji: "🎵" },
            { name: "Vidu Q1", id: "vidu/q1/image-to-video", emoji: "📽️" }
        ];

        let uploadedImageUrl = null;
        let debugMessages = [];

        // ==================== UTILS ====================
        function addDebug(msg) {
            debugMessages.push(`[${new Date().toLocaleTimeString()}] ${msg}`);
            const logEl = document.getElementById('debugLog');
            if (logEl) logEl.textContent = debugMessages.join('\n');
        }

        function toggleDebug() {
            const log = document.getElementById('debugLog');
            log.classList.toggle('hidden');
        }

        function saveApiKey() {
            const key = document.getElementById('apiKey').value.trim();
            if (key) localStorage.setItem('atlasApiKey', key);
        }

        function loadApiKey() {
            const saved = localStorage.getItem('atlasApiKey');
            if (saved) document.getElementById('apiKey').value = saved;
        }

        // ==================== UI ====================
        function renderModels() {
            const grid = document.getElementById('modelGrid');
            grid.innerHTML = '';
            models.forEach(m => {
                const div = document.createElement('div');
                div.className = `model-card p-4 border-2 rounded-3xl cursor-pointer flex flex-col items-center text-center ${m.id === currentModel.id ? 'selected' : 'border-zinc-700'}`;
                div.innerHTML = `
                    <div class="text-3xl mb-2">${m.emoji}</div>
                    <div class="font-semibold">${m.name}</div>
                `;
                div.onclick = () => {
                    currentModel = m;
                    renderModels();
                };
                grid.appendChild(div);
            });
        }

        // Image preview + upload
        document.getElementById('imageInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (ev) => {
                document.getElementById('preview').src = ev.target.result;
                document.getElementById('previewContainer').classList.remove('hidden');
                document.getElementById('uploadPlaceholder').classList.add('hidden');
            };
            reader.readAsDataURL(file);

            // Upload immediately to Atlas
            addDebug("Uploading image to Atlas Cloud...");
            const formData = new FormData();
            formData.append('file', file);

            const key = document.getElementById('apiKey').value.trim();
            try {
                const res = await fetch(`${BASE_URL}/model/uploadMedia`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${key}` },
                    body: formData
                });
                const data = await res.json();
                uploadedImageUrl = data.url || data.data?.url;
                addDebug(`✅ Image uploaded: ${uploadedImageUrl}`);
            } catch (err) {
                addDebug(`❌ Upload failed: ${err.message}`);
            }
        });

        // ==================== GENERATE ====================
        async function generateVideo() {
            const key = document.getElementById('apiKey').value.trim();
            const prompt = document.getElementById('prompt').value.trim();
            const resolution = document.getElementById('resolution').value;
            const duration = parseInt(document.getElementById('duration').value);

            if (!key) return alert("Please enter your Atlas Cloud API key");
            if (!prompt) return alert("Please write a prompt");
            if (!uploadedImageUrl) return alert("Please upload a photo first");

            saveApiKey();
            document.getElementById('status').classList.remove('hidden');
            document.getElementById('statusText').innerHTML = `<span class="text-emerald-400">🚀 Submitting to Atlas Cloud...</span>`;
            debugMessages = [];
            addDebug(`Using model: ${currentModel.name}`);

            try {
                // Step 1: Generate
                const generateRes = await fetch(`${BASE_URL}/model/generateVideo`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${key}`
                    },
                    body: JSON.stringify({
                        model: currentModel.id,
                        image: uploadedImageUrl,
                        prompt: prompt,
                        resolution: resolution,
                        duration: duration
                    })
                });

                const genData = await generateRes.json();
                const predictionId = genData.data?.id || genData.id;

                if (!predictionId) throw new Error("No prediction ID returned");

                addDebug(`✅ Job submitted — ID: ${predictionId}`);

                // Step 2: Poll
                let attempts = 0;
                const maxAttempts = 60;

                while (attempts < maxAttempts) {
                    attempts++;
                    await new Promise(r => setTimeout(r, 3000)); // 3s poll

                    const pollRes = await fetch(`${BASE_URL}/model/prediction/${predictionId}`, {
                        headers: { 'Authorization': `Bearer ${key}` }
                    });
                    const pollData = await pollRes.json();
                    const status = pollData.data?.status || pollData.status;

                    addDebug(`Poll ${attempts}: ${status}`);

                    if (status === "completed" || status === "succeeded") {
                        const videoUrl = pollData.data?.outputs?.[0] || pollData.outputs?.[0];
                        document.getElementById('statusText').innerHTML = `
                            🎉 <span class="text-emerald-400">Video Ready!</span><br>
                            <a href="${videoUrl}" target="_blank" class="text-blue-400 underline">Download Video</a>
                        `;
                        // Auto play in new tab or add video element if you want
                        window.open(videoUrl, '_blank');
                        return;
                    }
                    if (status === "failed") throw new Error(pollData.data?.error || "Generation failed");
                }
                throw new Error("Timed out");
            } catch (err) {
                document.getElementById('statusText').innerHTML = `❌ ${err.message}`;
                addDebug(`ERROR: ${err.message}`);
            }
        }

        // Init
        window.onload = () => {
            loadApiKey();
            renderModels();
            // Auto-select WAN Spicy on load
            console.log("%c✅ Animify Atlas Cloud version loaded!", "color:#22c55e;font-weight:bold");
        };
    </script>
</body>
</html>
